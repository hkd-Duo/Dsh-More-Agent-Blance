# dsh-team-balancer — weighted multi-AI balancing for Agent Teams.
#
# Mounts one Host plugin row and its Web configuration page. The values below
# are the factory defaults; the Plugins page editor saves overrides to
# <DSH_HOME>/storages/team-balancer/config.json and applies them live without a
# restart. The Lead Session is never rerouted.
- insert:
    - id: team-balancer
      name: 'dsh-plugin-team-balancer'
      config:
        enabled: true
        # Give the Lead a delegation policy: split work with two or more
        # independent workstreams across 2-4 teammates instead of serializing it.
        autoTeam: true
        # First pass gives every pool route one slot before weights repeat, so
        # the first two teammates already run on different providers.
        spread: true
        # Send a new parallel teammate to a provider that is not currently
        # running work. If GLM is busy and DeepSeek is idle, the new child goes
        # to DeepSeek even when weights or capability would repeat GLM.
        idleFirst: true
        # Also balance ordinary `subagent` / `subagent_fork` children.
        includeSubagents: false
        # Match a teammate to a model that fits its discipline. A teammate named
        # vision-*/image-*/ui-* prefers a vision-capable route (GLM), while
        # code-*/table-*/data-*/api-* prefers a code/table route (DeepSeek).
        capabilityRouting: true
        # Fallback when the name reveals nothing: auto (plain rotation),
        # balanced, code (prefer DeepSeek) or vision (prefer GLM).
        emphasis: auto
        # Weighted pool edited from the Web page. weight is a positive integer;
        # a route that is not currently routable is skipped at runtime.
        #
        # Factory pool: GLM carries 2/3 of the work, DeepSeek 1/3 (GLM 2 : 1).
        # With `spread` on, the first pass gives each route one slot, so the
        # first three teammates run deepseek-flash, glm-5.3-flash and glm-5.3
        # before the cycle repeats. Note the provider id: the Zai provider
        # mounts as `zai-coding-cn` on official profiles — the bare `zai` id
        # has no adapter and its route would be skipped at runtime.
        pool:
          - provider: deepseek-official
            model: deepseek-flash
            weight: 1
          - provider: zai-coding-cn
            model: glm-5.3-flash
            weight: 1
          - provider: zai-coding-cn
            model: glm-5.3
            weight: 1
