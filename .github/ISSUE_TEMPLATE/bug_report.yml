name: Bug report
description: Something in the balancer does not work as documented
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please include enough detail to reproduce it; the
        `request/header` lines from the affected child Session are the strongest evidence.
  - type: input
    id: dsh-version
    attributes:
      label: DSH version and profile
      description: For example "0.2.1-rc.2, desktop profile".
    validations:
      required: true
  - type: textarea
    id: pool
    attributes:
      label: Configured pool and state
      description: Paste the pool you configured, or the `GET /dsh-team-balancer/state` output (redact secrets).
      render: json
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the child Session `request/header` config lines when routing is involved.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the sidebar panel
        2. Set weights to ...
        3. Ask the Lead to create a teammate
        4. Observe ...
    validations:
      required: true
  - type: input
    id: include-subagents
    attributes:
      label: Is "Balance ordinary subagents too" enabled?
      placeholder: "yes / no"
  - type: textarea
    id: extra
    attributes:
      label: Logs, screenshots, anything else
